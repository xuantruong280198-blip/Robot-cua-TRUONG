name: Otto Desk N16R8 firmware build

on:
  push:
    paths:
      - "main/**"
      - "tools/**"
      - "components/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults*"
      - "sdkconfig.otto-desk.defaults"
      - "partitions/**"
      - "main/idf_component.yml"
      - "dependencies.lock"
      - ".github/workflows/otto-desk-smoke.yml"
  pull_request:
    paths:
      - "main/**"
      - "tools/**"
      - "components/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults*"
      - "sdkconfig.otto-desk.defaults"
      - "partitions/**"
      - "main/idf_component.yml"
      - "dependencies.lock"
      - ".github/workflows/otto-desk-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-otto-desk:
    name: Compile Otto Desk firmware (ESP32-S3 N16R8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull pinned ESP-IDF v6.0.2 build image
        shell: bash
        run: |
          docker pull espressif/idf:v6.0.2

      - name: Run complete hardware JSON and config-page regression tests
        shell: bash
        run: |
          python -m unittest tools/test_validate_config.py tools/test_config_page.py -v

      - name: Test merged firmware package verifier
        shell: bash
        run: |
          python -m unittest tools.test_otto_firmware_package -v

      - name: Compile and run JSON nesting guard tests
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Imain tools/test_json_nesting.cc -o /tmp/otto-json-nesting-tests
          /tmp/otto-json-nesting-tests

      - name: Compile and run OTA version comparison tests
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Imain tools/test_ota_version.cc -o /tmp/otto-ota-version-tests
          /tmp/otto-ota-version-tests

      - name: Verify OTA boot-confirmation and fragmented-header safeguards
        shell: bash
        run: |
          python -m unittest tools.test_validate_config.HardwareConfigValidationTests.test_ota_image_confirmation_is_independent_of_network_availability tools.test_validate_config.HardwareConfigValidationTests.test_ota_download_header_uses_only_newly_received_bytes -v

      - name: Compile and run ST7789 display rotation tests
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Imain/boards/otto-desk tools/test_display_rotation.cc -o /tmp/otto-display-rotation-tests
          /tmp/otto-display-rotation-tests

      - name: Compile and run hardware-independent head motion tests
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Imain/boards/otto-desk \
            tools/test_head_motion_planner.cc \
            main/boards/otto-desk/otto_desk_head_motion.cc \
            -o /tmp/otto-head-motion-tests
          /tmp/otto-head-motion-tests

      - name: Compile and run hardware-independent servo pulse tests
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Imain/boards/otto-desk tools/test_servo_math.cc -o /tmp/otto-servo-math-tests
          /tmp/otto-servo-math-tests

      - name: Compile and run hardware-independent I2S PCM conversion tests
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Imain/audio/codecs tools/test_i2s_audio_math.cc -o /tmp/otto-i2s-audio-math-tests
          /tmp/otto-i2s-audio-math-tests

      - name: Compile and run ESP32-S3 GPIO safety tests
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Imain/boards/otto-desk \
            tools/test_gpio_safety.cc \
            -o /tmp/otto-gpio-safety-tests
          /tmp/otto-gpio-safety-tests

      - name: Configure, build, and merge Otto Desk firmware
        shell: bash
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/project" \
            -w /project \
            -e IDF_GIT_SAFE_DIR=/project \
            espressif/idf:v6.0.2 bash -lc '
              idf.py set-target esp32s3 &&
              idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.otto-desk.defaults" reconfigure &&
              python tools/patch_wifi_config_routes.py &&
              grep -Fqx "CONFIG_BOARD_TYPE_OTTO_DESK=y" sdkconfig &&
              grep -Fqx "CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y" sdkconfig &&
              grep -Fqx "# CONFIG_BOOTLOADER_SKIP_VALIDATE_ALWAYS is not set" sdkconfig &&
              grep -Fqx "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" sdkconfig &&
              grep -Fqx "CONFIG_PARTITION_TABLE_CUSTOM=y" sdkconfig &&
              grep -Fqx '\''CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/16m.csv"'\'' sdkconfig &&
              idf.py build &&
              idf.py merge-bin -o otto-desk-merged.bin &&
              test -s build/otto-desk-merged.bin &&
              chmod -R a+rwX build
            '

      - name: Write build identity manifest
        shell: bash
        run: |
          {
            echo "artifact=otto-desk-n16r8-provisioning-firmware"
            echo "merged_image=otto-desk-merged.bin"
            echo "flash_offset=0x0"
            echo "target=esp32s3"
            echo "board_selection=CONFIG_BOARD_TYPE_OTTO_DESK"
            echo "flash_size=16MB"
            echo "partition_table=partitions/v2/16m.csv"
            echo "runtime_activation=explicit_json_opt_in"
            echo "hardware_validation=not-performed"
            echo "gpio_assignments=unconfigured_by_default"
            echo "commit=${GITHUB_SHA}"
          } > build/BUILD-MANIFEST.txt

      - name: Verify merged firmware flash layout and component bytes
        shell: bash
        run: |
          python tools/verify_otto_firmware_package.py build

      - name: Upload Otto Desk firmware image
        uses: actions/upload-artifact@v4
        with:
          name: otto-desk-n16r8-provisioning-firmware
          if-no-files-found: error
          retention-days: 14
          path: |
            build/otto-desk-merged.bin
            build/*.bin
            build/*.elf
            build/flasher_args.json
            build/project_description.json
            build/BUILD-MANIFEST.txt
            build/bootloader/*.bin
            build/partition_table/*.bin
