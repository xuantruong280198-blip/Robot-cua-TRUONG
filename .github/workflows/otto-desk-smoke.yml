name: Otto Desk board profile compile test

on:
  push:
    paths:
      - "main/**"
      - "tools/**"
      - "components/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults*"
      - "sdkconfig.otto-desk.defaults"
      - "partitions/**"
      - "main/idf_component.yml"
      - "dependencies.lock"
      - ".github/workflows/otto-desk-smoke.yml"
  pull_request:
    paths:
      - "main/**"
      - "tools/**"
      - "components/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults*"
      - "sdkconfig.otto-desk.defaults"
      - "partitions/**"
      - "main/idf_component.yml"
      - "dependencies.lock"
      - ".github/workflows/otto-desk-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-otto-desk:
    name: Compile Otto Desk safe board scaffold (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP-IDF v6.0.2
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v6.0.2"

      - name: Run complete hardware JSON and config-page regression tests
        shell: bash
        run: |
          python -m unittest tools/test_validate_config.py tools/test_config_page.py -v

      - name: Compile and run hardware-independent head motion tests
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Imain/boards/otto-desk \
            tools/test_head_motion_planner.cc \
            main/boards/otto-desk/otto_desk_head_motion.cc \
            -o /tmp/otto-head-motion-tests
          /tmp/otto-head-motion-tests

      - name: Compile and run hardware-independent servo pulse tests
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Imain/boards/otto-desk tools/test_servo_math.cc -o /tmp/otto-servo-math-tests
          /tmp/otto-servo-math-tests

      - name: Compile and run hardware-independent I2S PCM conversion tests
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Imain/audio/codecs tools/test_i2s_audio_math.cc -o /tmp/otto-i2s-audio-math-tests
          /tmp/otto-i2s-audio-math-tests

      - name: Compile and run ESP32-S3 GPIO safety tests
        shell: bash
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -Imain/boards/otto-desk \
            tools/test_gpio_safety.cc \
            -o /tmp/otto-gpio-safety-tests
          /tmp/otto-gpio-safety-tests

      - name: Configure ESP-IDF and select Otto Desk
        shell: bash
        run: |
          idf.py set-target esp32s3
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.otto-desk.defaults" reconfigure
          grep -Fqx "CONFIG_BOARD_TYPE_OTTO_DESK=y" sdkconfig
          grep -Fqx "CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y" sdkconfig
          grep -Fqx "CONFIG_PARTITION_TABLE_CUSTOM=y" sdkconfig
          grep -Fqx 'CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/16m.csv"' sdkconfig

      - name: Compile Otto Desk scaffold
        shell: bash
        run: |
          idf.py build

      - name: Write build identity manifest
        shell: bash
        run: |
          {
            echo "artifact=otto-desk-safe-scaffold-not-for-hardware-flashing"
            echo "target=esp32s3"
            echo "board_selection=CONFIG_BOARD_TYPE_OTTO_DESK"
            echo "flash_size=16MB"
            echo "partition_table=partitions/v2/16m.csv"
            echo "hardware_validation=not-performed"
            echo "gpio_assignments=unconfigured"
            echo "commit=${GITHUB_SHA}"
          } > build/BUILD-MANIFEST.txt

      - name: Upload Otto Desk scaffold build
        uses: actions/upload-artifact@v4
        with:
          name: otto-desk-safe-scaffold-not-for-hardware-flashing
          if-no-files-found: error
          retention-days: 14
          path: |
            build/*.bin
            build/*.elf
            build/flasher_args.json
            build/project_description.json
            build/BUILD-MANIFEST.txt
            build/bootloader/*.bin
            build/partition_table/*.bin
