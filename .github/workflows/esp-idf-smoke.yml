name: ESP-IDF firmware compile smoke test

on:
  push:
    paths:
      - "main/**"
      - "components/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults*"
      - "partitions/**"
      - "main/idf_component.yml"
      - "dependencies.lock"
      - ".github/workflows/esp-idf-smoke.yml"
  pull_request:
    paths:
      - "main/**"
      - "components/**"
      - "CMakeLists.txt"
      - "sdkconfig.defaults*"
      - "partitions/**"
      - "main/idf_component.yml"
      - "dependencies.lock"
      - ".github/workflows/esp-idf-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-esp32s3:
    name: Compile ESP32-S3 firmware (generic board smoke test)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure ESP-IDF environment
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3

      - name: Compile firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py build

      - name: Upload ESP32-S3 build outputs
        uses: actions/upload-artifact@v4
        with:
          name: otto-desk-esp32s3-build
          if-no-files-found: error
          retention-days: 14
          path: |
            build/*.bin
            build/*.elf
            build/flasher_args.json
            build/project_description.json
            build/bootloader/*.bin
            build/partition_table/*.bin
